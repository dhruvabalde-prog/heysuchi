name: Package HeySuchi source

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p release
          git archive --format=zip --output=release/heysuchi-source.zip HEAD
          cp PRODUCT_REQUIREMENTS_DOCUMENT.md release/PRODUCT_REQUIREMENTS_DOCUMENT.md
          zip -j release/heysuchi-complete-source-and-prd.zip release/heysuchi-source.zip release/PRODUCT_REQUIREMENTS_DOCUMENT.md
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: heysuchi-complete-source-and-prd
          path: release/heysuchi-complete-source-and-prd.zip
