name: Verify Next.js build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add npm lockfile"
            git push
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Package source and PRD
        if: always()
        run: |
          mkdir -p release
          cp PRODUCT_REQUIREMENTS_DOCUMENT.md release/ 2>/dev/null || true
          cp README_ARCHIVE.md release/ 2>/dev/null || true
          git archive --format=zip --output=release/heysuchi-source.zip HEAD
          cd release
          zip -r heysuchi-complete-source-and-prd.zip heysuchi-source.zip PRODUCT_REQUIREMENTS_DOCUMENT.md README_ARCHIVE.md
      - name: Upload source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heysuchi-complete-source-and-prd
          path: release/heysuchi-complete-source-and-prd.zip
          if-no-files-found: error
